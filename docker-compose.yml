services:
  api1:
    image: otonielsilva/rinhabackend-2026:1.0
    pull_policy: always
    environment:
      RINHA_RESOURCES_DIR: /app/resources
      RINHA_CACHE_DIR: /app/cache
      RINHA_LISTEN_UNIX: /var/run/sockets/api1.sock
      GOMEMLIMIT: 140MiB
      GOMAXPROCS: "1"
    volumes:
      - ./resources:/app/resources:ro
      - socket_vol:/var/run/sockets
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9999/ready || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.46"
          memory: 160M

  api2:
    image: otonielsilva/rinhabackend-2026:1.0
    pull_policy: always
    environment:
      RINHA_RESOURCES_DIR: /app/resources
      RINHA_CACHE_DIR: /app/cache
      RINHA_LISTEN_UNIX: /var/run/sockets/api2.sock
      GOMEMLIMIT: 140MiB
      GOMAXPROCS: "1"
    volumes:
      - ./resources:/app/resources:ro
      - socket_vol:/var/run/sockets
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9999/ready || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.46"
          memory: 160M

  lb:
    image: nginx:1.27-alpine
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - socket_vol:/var/run/sockets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9999/ready || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "0.08"
          memory: 20M

networks:
  default:
    driver: bridge

volumes:
  socket_vol:
