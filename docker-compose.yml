services:
  api1:
    build: .
    image: ${DOCKER_IMAGE:-rinhabackend-2026:local}
    environment:
      RINHA_RESOURCES_DIR: /app/resources
      RINHA_CACHE_DIR: /app/cache
      # ~87MB live heap (3M refs). Soft limit below the 160M cgroup cap forces
      # the GC to collect before the kernel OOM-kills the process under load.
      GOMEMLIMIT: 140MiB
      # Container has 0.46 CPU quota; without this Go creates GOMAXPROCS=host_cpus
      # (4 on GH Actions), causing 4 OS threads to fight for 460ms/sec of CPU.
      GOMAXPROCS: "1"
    volumes:
      - ./resources:/app/resources:ro
    expose:
      - "9999"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9999/ready || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.46"
          memory: 160M

  api2:
    build: .
    image: ${DOCKER_IMAGE:-rinhabackend-2026:local}
    environment:
      RINHA_RESOURCES_DIR: /app/resources
      RINHA_CACHE_DIR: /app/cache
      GOMEMLIMIT: 140MiB
      GOMAXPROCS: "1"
    volumes:
      - ./resources:/app/resources:ro
    expose:
      - "9999"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9999/ready || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.46"
          memory: 160M

  lb:
    image: nginx:1.27-alpine
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.08"
          memory: 20M

networks:
  default:
    driver: bridge
