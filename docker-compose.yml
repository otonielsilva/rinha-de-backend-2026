services:
  api1:
    image: ${DOCKER_IMAGE:-docker.io/otonielsilva/rinhabackend-2026:latest}
    environment:
      RINHA_RESOURCES_DIR: /app/resources
      RINHA_CACHE_DIR: /app/cache
      GOMEMLIMIT: 140MiB
      GOMAXPROCS: "1"
    volumes:
      - ./resources:/app/resources:ro
    expose:
      - "9999"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9999/ready || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.46"
          memory: 160M

  api2:
    image: ${DOCKER_IMAGE:-docker.io/otonielsilva/rinhabackend-2026:latest}
    environment:
      RINHA_RESOURCES_DIR: /app/resources
      RINHA_CACHE_DIR: /app/cache
      GOMEMLIMIT: 140MiB
      GOMAXPROCS: "1"
    volumes:
      - ./resources:/app/resources:ro
    expose:
      - "9999"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9999/ready || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.46"
          memory: 160M

  lb:
    image: nginx:1.27-alpine
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.08"
          memory: 20M

networks:
  default:
    driver: bridge
