services:
  k6-load:
    image: grafana/k6:latest
    user: root
    environment:
      - K6_NO_USAGE_REPORT=true
    volumes:
      - ./test:/test
    working_dir: /test
    command: run /test/test.js
    network_mode: "host"
    depends_on:
      lb:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8G
